# Builds Kade for macOS (universal .app) and Linux (AppImage + .deb) when a
# version tag is pushed, and attaches everything to a GitHub release.
# Asset names don't contain the version, so the install scripts can always use
# https://github.com/jurnskie/kade/releases/latest/download/<asset>.
#
# Release:            ./scripts/release.sh 0.4.0
# Rebuild a version:  gh workflow run release.yml -R jurnskie/kade -f tag=v0.1.0 -f platforms=linux

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag, e.g. v0.4.0"
        required: true
      platforms:
        description: "Which builds"
        type: choice
        options: [all, macos, linux]
        default: all

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - id: v
        run: |
          tag="${TAG#v}"
          app=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$tag" != "$app" ]; then
            echo "::error::Tag $TAG does not match tauri.conf.json ($app)"
            exit 1
          fi
          echo "version=$app" >> "$GITHUB_OUTPUT"

  macos:
    needs: version
    if: ${{ !inputs.platforms || inputs.platforms == 'all' || inputs.platforms == 'macos' }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      # Install scripts come from this workflow's own commit, so rebuilding an
      # older tag still ships the current scripts.
      - uses: actions/checkout@v7
        with:
          path: current
          sparse-checkout: scripts
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (universal)
        run: pnpm tauri build --target universal-apple-darwin --bundles app
      - name: Package
        run: |
          mkdir -p dist
          ditto -c -k --keepParent \
            src-tauri/target/universal-apple-darwin/release/bundle/macos/Kade.app \
            dist/Kade-macos-universal.zip
          cp current/scripts/install-macos.sh dist/
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/

  linux:
    needs: version
    if: ${{ !inputs.platforms || inputs.platforms == 'all' || inputs.platforms == 'linux' }}
    # The oldest supported Ubuntu, so the AppImage runs on older glibc too.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      # Install scripts come from this workflow's own commit, so rebuilding an
      # older tag still ships the current scripts.
      - uses: actions/checkout@v7
        with:
          path: current
          sparse-checkout: scripts
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev build-essential file
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm tauri build --bundles appimage,deb
      - name: Package
        run: |
          b=src-tauri/target/release/bundle
          mkdir -p dist
          cp "$b"/appimage/*.AppImage dist/Kade-linux-x86_64.AppImage
          cp "$b"/deb/*.deb dist/Kade-linux-amd64.deb
          cp src-tauri/icons/128x128@2x.png dist/kade.png
          cp current/scripts/install-linux.sh dist/
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/

  release:
    needs: [version, macos, linux]
    # Run when at least one build succeeded and none failed.
    if: ${{ always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          for f in Kade-*; do sha256sum "$f" > "$f.sha256"; done
          ls -la
      - name: Publish or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "Kade ${{ needs.version.outputs.version }}" --generate-notes
          fi
          gh release upload "$TAG" dist/* --clobber
