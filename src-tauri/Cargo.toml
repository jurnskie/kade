[package]
name = "kade"
version = "0.5.0"
description = "A friendly SSH, SFTP and FTP manager for Linux and macOS"
authors = ["Jurn Spijksma"]
license = "MIT"
repository = "https://github.com/jurnskie/kade"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kade_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = "0.64.0"
russh-sftp = "3.0.1"
tokio = { version = "1.53.2", features = ["full"] }
anyhow = "1.0.104"
thiserror = "2.0.21"
dirs = "7.0.0"
uuid = { version = "1.27.0", features = ["v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
notify = "8.2.0"
tauri-plugin-dialog = "2.8.1"
suppaftp = { version = "12.1.1", features = ["tokio-rustls-ring", "deprecated"] }
webpki-roots = "1.0.9"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2.2.0"
shlex = "2.0.1"
rmcp = { version = "3.5.0", features = ["server", "macros", "transport-streamable-http-server"] }
axum = "0.8.9"
schemars = "1.2.2"
tokio-util = "0.7.19"
sha2 = "0.11.0"
hex = "0.4.3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
